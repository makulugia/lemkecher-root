<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemkecher</title>
    <meta name="description" content="Lemkecher">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#FFFFFF">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        #net {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        #logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 92vw;
            max-height: 88vh;
            width: auto;
            height: auto;
            z-index: 2;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <canvas id="net" aria-hidden="true"></canvas>
    <img id="logo" src="logo2.png" alt="Lemkecher in Arabic calligraphy">

    <script>
    (() => {
        'use strict';

        // ---- Settings you may want to tweak ----
        const CFG = {
            color: '200,16,46',     // #C8102E as r,g,b
            areaPerParticle: 11000, // larger = fewer dots
            minN: 35,
            maxN: 160,
            speed: 22,              // drift speed, px per second
            link: 140,              // max distance for a connecting line
            cell: 4,                // resolution of the ink map, px
            inkReach: 34,           // how far from a stroke the dots start to feel it
            inkPush: 260,           // how firmly they are pushed around strokes
            pointerReach: 170,
            pointerPull: 40
        };

        const canvas = document.getElementById('net');
        const ctx = canvas.getContext('2d');
        const logo = document.getElementById('logo');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const rgba = a => 'rgba(' + CFG.color + ',' + a.toFixed(3) + ')';

        let W = 0, H = 0, dpr = 1;
        let parts = [];
        let field = null;
        const pointer = { x: -1e4, y: -1e4, active: false };

        // ---- Ink map: signed distance to the calligraphy strokes ----
        function distanceTransform(src, gx, gy) {
            const n = gx * gy, d = new Float32Array(n), A = 1, B = Math.SQRT2;
            for (let i = 0; i < n; i++) d[i] = src[i] ? 0 : 1e9;
            for (let y = 0; y < gy; y++) for (let x = 0; x < gx; x++) {
                const i = y * gx + x; let v = d[i]; if (!v) continue;
                if (x > 0) v = Math.min(v, d[i - 1] + A);
                if (y > 0) {
                    v = Math.min(v, d[i - gx] + A);
                    if (x > 0) v = Math.min(v, d[i - gx - 1] + B);
                    if (x < gx - 1) v = Math.min(v, d[i - gx + 1] + B);
                }
                d[i] = v;
            }
            for (let y = gy - 1; y >= 0; y--) for (let x = gx - 1; x >= 0; x--) {
                const i = y * gx + x; let v = d[i]; if (!v) continue;
                if (x < gx - 1) v = Math.min(v, d[i + 1] + A);
                if (y < gy - 1) {
                    v = Math.min(v, d[i + gx] + A);
                    if (x < gx - 1) v = Math.min(v, d[i + gx + 1] + B);
                    if (x > 0) v = Math.min(v, d[i + gx - 1] + B);
                }
                d[i] = v;
            }
            return d;
        }

        function buildField() {
            field = null;
            if (!logo.complete || !logo.naturalWidth) return;
            const r = logo.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const C = CFG.cell, M = CFG.inkReach + 8;
            const gx = Math.ceil((r.width + 2 * M) / C), gy = Math.ceil((r.height + 2 * M) / C);
            const off = document.createElement('canvas');
            off.width = gx; off.height = gy;
            const o = off.getContext('2d', { willReadFrequently: true });
            o.drawImage(logo, M / C, M / C, r.width / C, r.height / C);
            let data;
            try { data = o.getImageData(0, 0, gx, gy).data; } catch (e) { return; }
            const n = gx * gy, ink = new Uint8Array(n), paper = new Uint8Array(n);
            for (let i = 0; i < n; i++) {
                const k = i * 4, lum = (data[k] + data[k + 1] + data[k + 2]) / 3;
                ink[i] = data[k + 3] > 110 && lum < 128 ? 1 : 0;
                paper[i] = 1 - ink[i];
            }
            const out = distanceTransform(ink, gx, gy);   // distance outside the strokes
            const inn = distanceTransform(paper, gx, gy); // depth inside the strokes
            const s = new Float32Array(n);
            for (let i = 0; i < n; i++) s[i] = (Math.min(out[i], 1e4) - Math.min(inn[i], 1e4)) * C;
            field = { x0: r.left - M, y0: r.top - M, gx, gy, C, s };
        }

        // Returns distance to the nearest stroke (negative inside) and the outward direction.
        const probe = { d: 0, nx: 0, ny: 0 };
        function sample(x, y) {
            const f = field; if (!f) return null;
            const ix = Math.floor((x - f.x0) / f.C), iy = Math.floor((y - f.y0) / f.C);
            if (ix < 1 || iy < 1 || ix >= f.gx - 1 || iy >= f.gy - 1) return null;
            const i = iy * f.gx + ix, s = f.s;
            const gx = s[i + 1] - s[i - 1], gy = s[i + f.gx] - s[i - f.gx];
            const g = Math.hypot(gx, gy) || 1;
            probe.d = s[i]; probe.nx = gx / g; probe.ny = gy / g;
            return probe;
        }

        // ---- Particles ----
        function makeParticle(x, y) {
            const a = Math.random() * Math.PI * 2, sp = CFG.speed * (0.5 + Math.random());
            const bx = Math.cos(a) * sp, by = Math.sin(a) * sp;
            return { x, y, vx: bx, vy: by, bx, by, sp, r: 1.2 + Math.random() * 2.3, glow: 0 };
        }

        function spawnFree() {
            for (let k = 0; k < 20; k++) {
                const x = Math.random() * W, y = Math.random() * H, s = sample(x, y);
                if (!s || s.d > CFG.inkReach * 0.5) return makeParticle(x, y);
            }
            return makeParticle(Math.random() * W, Math.random() * H);
        }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            buildField();
            const target = Math.max(CFG.minN, Math.min(CFG.maxN, Math.round(W * H / CFG.areaPerParticle)));
            while (parts.length < target) parts.push(spawnFree());
            if (parts.length > target) parts.length = target;
            for (const p of parts) {
                if (p.x > W) p.x = Math.random() * W;
                if (p.y > H) p.y = Math.random() * H;
            }
            if (!running) draw();
        }

        function step(dt) {
            const reach = CFG.inkReach;
            const relax = Math.min(1, dt * 0.8);
            for (const p of parts) {
                let ax = 0, ay = 0;
                p.glow = Math.max(0, p.glow - dt * 1.5);

                // Flow around the calligraphy like water around a stone
                const s = sample(p.x, p.y);
                if (s && s.d < reach) {
                    const k = Math.min(2, 1 - s.d / reach);
                    const f = CFG.inkPush * k * k;
                    ax += s.nx * f; ay += s.ny * f;
                    // Turn the drift direction to run along the stroke instead of into it
                    const bn = p.bx * s.nx + p.by * s.ny;
                    if (bn < 0) {
                        const t = Math.min(1, k * dt * 3);
                        p.bx -= bn * s.nx * t; p.by -= bn * s.ny * t;
                        const m = Math.hypot(p.bx, p.by) || 1;
                        p.bx = p.bx / m * p.sp; p.by = p.by / m * p.sp;
                    }
                    p.glow = Math.max(p.glow, Math.min(1, k));
                }

                // Gentle pull toward the mouse
                if (pointer.active) {
                    const dx = pointer.x - p.x, dy = pointer.y - p.y, d = Math.hypot(dx, dy);
                    if (d > 1 && d < CFG.pointerReach) {
                        const f = CFG.pointerPull * (1 - d / CFG.pointerReach);
                        ax += dx / d * f; ay += dy / d * f;
                    }
                }

                p.vx += ax * dt; p.vy += ay * dt;
                p.vx += (p.bx - p.vx) * relax; p.vy += (p.by - p.vy) * relax;
                const v = Math.hypot(p.vx, p.vy), vmax = CFG.speed * 5;
                if (v > vmax) { p.vx *= vmax / v; p.vy *= vmax / v; }

                p.x += p.vx * dt; p.y += p.vy * dt;
                const m = 20;
                if (p.x < -m) p.x = W + m; else if (p.x > W + m) p.x = -m;
                if (p.y < -m) p.y = H + m; else if (p.y > H + m) p.y = -m;
            }
        }

        function line(ax, ay, bx, by) {
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const L = CFG.link, L2 = L * L, n = parts.length;
            ctx.lineWidth = 1;
            for (let i = 0; i < n; i++) {
                const a = parts[i];
                for (let j = i + 1; j < n; j++) {
                    const b = parts[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
                    if (d2 < L2) {
                        const t = 1 - Math.sqrt(d2) / L, g = (a.glow + b.glow) * 0.5;
                        ctx.strokeStyle = rgba(t * (0.25 + 0.35 * g));
                        line(a.x, a.y, b.x, b.y);
                    }
                }
            }
            if (pointer.active) {
                for (const p of parts) {
                    const d = Math.hypot(p.x - pointer.x, p.y - pointer.y);
                    if (d < CFG.pointerReach) {
                        ctx.strokeStyle = rgba(0.4 * (1 - d / CFG.pointerReach));
                        line(p.x, p.y, pointer.x, pointer.y);
                    }
                }
            }
            for (const p of parts) {
                if (p.glow > 0.05) {
                    ctx.fillStyle = rgba(0.12 * p.glow);
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = rgba(0.55 + 0.4 * p.glow);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + 0.5 * p.glow), 0, Math.PI * 2); ctx.fill();
            }
        }

        // ---- Loop: pauses in background tabs, static for reduced motion ----
        let running = false, last = 0;
        function frame(t) {
            if (!running) return;
            const dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016;
            last = t;
            step(dt); draw();
            requestAnimationFrame(frame);
        }
        function start() {
            if (running || reduceMotion.matches || document.hidden) return;
            running = true; last = 0;
            requestAnimationFrame(frame);
        }
        function stop() { running = false; }

        document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
        if (reduceMotion.addEventListener) {
            reduceMotion.addEventListener('change', () => { stop(); if (reduceMotion.matches) draw(); else start(); });
        }

        // ---- Interaction (listens on the window, so it also works over the logo) ----
        window.addEventListener('pointermove', e => {
            pointer.x = e.clientX; pointer.y = e.clientY;
            pointer.active = e.pointerType === 'mouse';
        }, { passive: true });
        document.addEventListener('mouseout', e => { if (!e.relatedTarget) pointer.active = false; });
        window.addEventListener('blur', () => { pointer.active = false; });
        window.addEventListener('pointerdown', e => {
            for (let k = 0; k < 3; k++) {
                parts.push(makeParticle(e.clientX + (Math.random() - 0.5) * 24, e.clientY + (Math.random() - 0.5) * 24));
            }
            const cap = Math.round(CFG.maxN * 1.3);
            if (parts.length > cap) parts.splice(0, parts.length - cap);
            if (!running) draw();
        });

        let resizeTimer;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });

        resize();
        if (!logo.complete) logo.addEventListener('load', () => { buildField(); if (!running) draw(); });
        start();
    })();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
    }
    </script>
</body>
</html>
